name: WFL Twin TRAIN Prize Backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public_compute/queue/hourly_twin_train_backtest.json"

permissions:
  contents: write

concurrency:
  group: wfl-twin-train-prize-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: public_compute/requirements.txt
      - run: python -m pip install -r public_compute/requirements.txt
      - name: Run TRAIN-only prize-category backtest
        env:
          PYTHONPATH: public_compute
        run: python public_compute/backtest_hourly_twin_prizes.py
      - name: Commit retrodictive report
        run: |
          set -eu
          git config user.name "wfl-hourly-twin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public_compute/results/hourly_twin_train_prize_backtest_candidate_16.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "WFL: add TRAIN-only twin prize-category backtest"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep 5
          done
          exit 1
