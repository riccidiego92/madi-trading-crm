name: WFL P43 FINAL_TRAIN Bootstrap

on:
  push:
    branches: [main]
    paths:
      - "public_compute/results/final_train_plan.json"
      - "public_compute/queue/final_train_bootstrap_now.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: public_compute/requirements.txt
      - run: python -m pip install -r public_compute/requirements.txt
      - name: Freeze first active FINAL_TRAIN batch
        env:
          PYTHONPATH: public_compute
        run: python public_compute/final_train_controller.py bootstrap
      - name: Commit queue and state
        run: |
          set -eu
          git config user.name "wfl-final-train-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public_compute/queue/final_train_active_batch.json public_compute/results/final_train/state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "P43: bootstrap frozen FINAL_TRAIN queue"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
