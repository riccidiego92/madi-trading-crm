name: WFL State Leakage V1

on:
  push:
    branches: [main]
    paths:
      - "public_compute/state_leakage_v1_config.json"
      - "public_compute/run_state_leakage_v1.py"
      - "public_compute/queue/state_leakage_v1_now.json"
      - ".github/workflows/wfl_state_leakage_v1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wfl-state-leakage-v1
  cancel-in-progress: false

jobs:
  train-only-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: public_compute/requirements.txt
      - run: python -m pip install -r public_compute/requirements.txt
      - name: Run frozen TRAIN-only state leakage diagnostic
        run: |
          python public_compute/run_state_leakage_v1.py \
            --out public_compute/results/state_leakage_v1.json
      - name: Commit immutable result
        run: |
          set -eu
          git config user.name "wfl-state-leakage-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public_compute/results/state_leakage_v1.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "WFL: record TRAIN-only state leakage V1"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep 5
          done
          exit 1
