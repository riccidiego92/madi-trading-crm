name: WFL Hourly Twin Freeze

on:
  schedule:
    - cron: "40 4-21 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public_compute/queue/hourly_twin_now.json"

permissions:
  contents: write

concurrency:
  group: wfl-hourly-twin-freeze
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: public_compute/requirements.txt
      - run: python -m pip install -r public_compute/requirements.txt
      - name: Freeze next hourly development prediction
        env:
          PYTHONPATH: public_compute
        run: |
          python public_compute/hourly_twin.py freeze             --candidate-index 16             --min-lead-seconds 300
      - name: Commit immutable freeze
        run: |
          set -eu
          git config user.name "wfl-hourly-twin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public_compute/prospective/hourly
          if git diff --cached --quiet; then
            echo "No new hourly freeze"
            exit 0
          fi
          git commit -m "WFL: freeze next hourly development prediction"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep 5
          done
          exit 1
