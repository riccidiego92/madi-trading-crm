name: WFL P43 Public Member Confirmation Batch

on:
  push:
    branches: [main]
    paths:
      - "public_compute/queue/member_confirmation.json"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      batch_index: ${{ steps.plan.outputs.batch_index }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          q=json.loads(Path("public_compute/queue/member_confirmation.json").read_text())
          if q.get("schema")!="wfl-public-p43-member-confirmation-1":
              raise SystemExit("bad queue schema")
          bi=int(q["batch_index"]); bc=int(q["batch_count"])
          if bc != 24 or not 0 <= bi < bc:
              raise SystemExit("frozen public batch policy requires 24 batches")
          ids=[i for i in range(384) if i % bc == bi]
          print("batch_index="+str(bi))
          print("matrix="+json.dumps({"candidate_index":ids},separators=(",",":")))
          PY

  evaluate:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: public_compute/requirements.txt
      - run: python -m pip install -r public_compute/requirements.txt
      - name: Evaluate frozen P43 member confirmation candidate
        env:
          PYTHONPATH: public_compute
          CANDIDATE_INDEX: ${{ matrix.candidate_index }}
        run: |
          set -eu
          mkdir -p public_compute/out
          python public_compute/run_candidate.py             --candidate-index "$CANDIDATE_INDEX"             --reps 2000             --out "public_compute/out/candidate_${CANDIDATE_INDEX}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.candidate_index }}
          path: public_compute/out/candidate_${{ matrix.candidate_index }}.json
          retention-days: 14

  collect:
    needs: [plan, evaluate]
    runs-on: ubuntu-latest
    if: ${{ needs.evaluate.result == 'success' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-*
          path: combined
          merge-multiple: true
      - name: Validate batch result count
        run: |
          set -eu
          test "$(find combined -type f -name 'candidate_*.json' | wc -l)" -eq 16
      - uses: actions/upload-artifact@v4
        with:
          name: p43-member-confirmation-batch-${{ needs.plan.outputs.batch_index }}
          path: combined/*.json
          retention-days: 14
