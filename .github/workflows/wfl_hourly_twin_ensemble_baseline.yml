name: WFL Twin Ensemble Structural Baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public_compute/queue/hourly_twin_ensemble_baseline.json"

permissions:
  contents: write

concurrency:
  group: wfl-twin-ensemble-structural-baseline
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: public_compute/requirements.txt
      - run: python -m pip install -r public_compute/requirements.txt
      - name: Build TRAIN-only structural convergence baseline
        env:
          PYTHONPATH: public_compute
        run: |
          set -eu
          git config user.name "wfl-hourly-twin-bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3 4; do
            git fetch origin main
            git checkout -B baseline-work origin/main

            python public_compute/build_hourly_twin_ensemble_baseline.py

            git add public_compute/results/hourly_twin_ensemble_structural_baseline.json
            if git diff --cached --quiet; then
              echo "Baseline unchanged"
              exit 0
            fi

            git commit -m "WFL: freeze TRAIN-only twin ensemble structural baseline"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Concurrent main update; rebuilding from latest main"
            sleep 5
          done

          exit 1
