name: WFL Hourly Twin Score

on:
  schedule:
    - cron: "15 5-22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public_compute/queue/hourly_twin_score_now.json"

permissions:
  contents: write

concurrency:
  group: wfl-hourly-twin-score
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: public_compute/requirements.txt
      - run: python -m pip install -r public_compute/requirements.txt
      - name: Score, rebuild prize ledger, and publish atomically
        env:
          PYTHONPATH: public_compute
        run: |
          set -eu
          git config user.name "wfl-hourly-twin-bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3 4; do
            git fetch origin main
            git checkout -B score-work origin/main

            python public_compute/score_hourly_twin.py
            python public_compute/summarize_hourly_twin.py

            git add public_compute/prospective/hourly_scores                     public_compute/prospective/hourly_evidence.json

            if git diff --cached --quiet; then
              echo "No new official scores or ledger changes"
              exit 0
            fi

            git commit -m "WFL: score hourly predictions and update prize ledger"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Concurrent main update; regenerating from latest main"
            sleep 5
          done

          exit 1
