name: WFL P43 Parallel Equivalence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wfl_p43_parallel_equivalence.yml"

permissions:
  contents: read

jobs:
  equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: public_compute/requirements.txt
      - run: python -m pip install -r public_compute/requirements.txt
      - env:
          PYTHONPATH: public_compute
        run: python public_compute/test_parallel_equivalence.py
