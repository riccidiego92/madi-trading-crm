name: WFL P43 FINAL_TRAIN Shard Smoke

on:
  push:
    branches: [main]
    paths:
      - "public_compute/queue/final_train_shard_smoke.json"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: public_compute/requirements.txt
      - run: python -m pip install -r public_compute/requirements.txt
      - name: Compile sharded FINAL_TRAIN code
        run: |
          python -m py_compile             public_compute/wfl_public/p43_final_train_sharded.py             public_compute/run_final_train_calibration_shard.py             public_compute/aggregate_final_train_calibration.py             public_compute/run_final_train_null_shard.py             public_compute/aggregate_final_train_result.py
      - name: Run tiny calibration shard
        env:
          PYTHONPATH: public_compute
        run: |
          python public_compute/run_final_train_calibration_shard.py             --candidate-index 0             --rep-start 0             --rep-count 4             --out public_compute/out/final_train_smoke_candidate_0.json
          python - <<'PY'
          import json
          p="public_compute/out/final_train_smoke_candidate_0.json"
          row=json.load(open(p))
          assert row["schema"] == "wfl-p43-final-train-calibration-shard-1"
          assert row["rep_start"] == 0
          assert row["rep_count"] == 4
          assert row["guardrails"]["validation_accessed"] is False
          assert row["guardrails"]["holdout_accessed"] is False
          assert len(row["sum"]) == row["feature_count"]
          assert len(row["sum_sq"]) == row["feature_count"]
          print("FINAL_TRAIN_SHARD_SMOKE_OK")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: final-train-shard-smoke
          path: public_compute/out/final_train_smoke_candidate_0.json
          if-no-files-found: error
          retention-days: 3
