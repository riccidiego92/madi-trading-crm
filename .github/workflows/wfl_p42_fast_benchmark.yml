name: WFL P42 Fast Benchmark

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wfl_p42_fast_benchmark.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: public_compute/requirements.txt
      - run: python -m pip install -r public_compute/requirements.txt
      - env:
          PYTHONPATH: public_compute
        run: python public_compute/profile_fast_one.py
