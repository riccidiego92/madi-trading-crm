name: WFL P43 Public Rescue Singles

on:
  push:
    branches: [main]
    paths:
      - "public_compute/queue/member_confirmation_single.json"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          q=json.loads(Path("public_compute/queue/member_confirmation_single.json").read_text())
          if q.get("schema") != "wfl-public-p43-member-confirmation-single-1":
              raise SystemExit("bad single rescue queue schema")
          if q.get("reps") != 2000 or q.get("alpha") != 0.01 or q.get("train_only") is not True:
              raise SystemExit("scientific policy mismatch")
          indices=[int(x) for x in q.get("candidate_indices",[])]
          if not indices or len(indices) != len(set(indices)):
              raise SystemExit("empty/duplicate candidate indices")
          if any(x < 0 or x >= 384 for x in indices):
              raise SystemExit("candidate index out of range")
          print("matrix="+json.dumps({"candidate_index":indices},separators=(",",":")))
          PY

  evaluate:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: public_compute/requirements.txt
      - run: python -m pip install -r public_compute/requirements.txt
      - name: Evaluate one P43 member-confirmation candidate
        env:
          PYTHONPATH: public_compute
          IDX: ${{ matrix.candidate_index }}
        run: |
          set -eu
          mkdir -p public_compute/out
          python public_compute/run_candidate.py             --candidate-index "$IDX"             --reps 2000             --out "public_compute/out/candidate_${IDX}.json"             --quiet
          python - <<'PY'
          import json, os
          idx=int(os.environ["IDX"])
          row=json.load(open(f"public_compute/out/candidate_{idx}.json"))
          if row.get("schema") != "wfl-p43-p42-train-candidate-evaluation-1":
              raise SystemExit("bad result schema")
          if row.get("stage") != "train" or int(row.get("simulation_reps",0)) != 2000:
              raise SystemExit("bad TRAIN/reps")
          g=row.get("guardrails",{})
          if g.get("validation_accessed") is not False or g.get("holdout_accessed") is not False:
              raise SystemExit("validation/holdout guardrail breach")
          p=float(row["test"]["p_max_stat"])
          if row["test"].get("rejected_at_triage_alpha") is not (p <= 0.01):
              raise SystemExit("alpha=0.01 decision mismatch")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p43-rescue-single-${{ matrix.candidate_index }}
          path: public_compute/out/candidate_${{ matrix.candidate_index }}.json
          if-no-files-found: error
          retention-days: 14
