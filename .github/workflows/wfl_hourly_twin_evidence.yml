name: WFL Hourly Twin Evidence

on:
  push:
    branches: [main]
    paths:
      - "public_compute/prospective/hourly_scores/**"

permissions:
  contents: write

concurrency:
  group: wfl-hourly-twin-evidence
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild prospective evidence ledger
        run: python public_compute/summarize_hourly_twin.py
      - name: Commit evidence ledger
        run: |
          set -eu
          git config user.name "wfl-hourly-twin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public_compute/prospective/hourly_evidence.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "WFL: update hourly prospective evidence ledger"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep 5
          done
          exit 1
