name: WFL P42 Fast Equivalence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wfl_p42_fast_equivalence.yml"
      - "public_compute/wfl_public/p42_fast.py"
      - "public_compute/wfl_public/p42_phased_draw_machine.py"
      - "public_compute/test_fast_equivalence.py"

permissions:
  contents: read

jobs:
  equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: public_compute/requirements.txt
      - run: python -m pip install -r public_compute/requirements.txt
      - env:
          PYTHONPATH: public_compute
        run: python public_compute/test_fast_equivalence.py
