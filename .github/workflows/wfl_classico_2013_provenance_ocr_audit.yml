name: WFL Classico 2013 Provenance OCR Audit

on:
  push:
    branches: [main]
    paths:
      - "public_compute/queue/classico_2013_provenance_ocr_audit_now.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wfl-classico-2013-provenance-ocr-audit
  cancel-in-progress: false

jobs:
  ocr-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-ita
      - name: OCR official ADM scans
        run: python public_compute/run_classico_2013_provenance_ocr_audit.py
      - name: Commit audit result
        run: |
          set -eu
          git config user.name "wfl-provenance-ocr-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public_compute/results/classico_2013_provenance_ocr_audit.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "WFL: record Classico 2013 OCR provenance audit"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep 5
          done
          exit 1
