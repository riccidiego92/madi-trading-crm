name: WFL Serial State Sensitivity V2

on:
  push:
    branches: [main]
    paths:
      - "public_compute/queue/serial_state_sensitivity_v2_now.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synthetic-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: public_compute/requirements.txt
      - run: python -m pip install -r public_compute/requirements.txt
      - name: Run frozen synthetic sensitivity benchmark
        run: |
          python public_compute/run_serial_state_sensitivity_v2.py \
            --out public_compute/results/serial_state_sensitivity_v2.json
      - name: Commit result
        run: |
          set -eu
          git config user.name "wfl-sensitivity-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public_compute/results/serial_state_sensitivity_v2.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "WFL: record serial-state synthetic sensitivity V2"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep 5
          done
          exit 1
